<template>
    <lightning-card title="PDF Engine" icon-name="utility:sync">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-col slds-grow">
                    <p class="slds-text-title_caps slds-m-bottom_xx-small">Worker Status</p>
                    <p class="slds-text-body_regular">{statusMessage}</p>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-button
                        variant="brand"
                        label="Process Queue Now"
                        onclick={handleProcessNow}
                        disabled={isBusy}
                    ></lightning-button>
                </div>
            </div>

            <template lwc:if={lastError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <h2>{lastError}</h2>
                </div>
            </template>

            <p class="slds-text-body_small slds-text-color_weak">
                Keep this tab open while jobs are Pending. The engine polls automatically every
                {pollSeconds} seconds and also runs when you click Process Queue Now.
            </p>
        </div>
    </lightning-card>
</template>
